<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Modern Chain Link Company | Login</title>

    <link rel="stylesheet" href="css/login.css">

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

</head>

<body>

    <!-- Background Design -->

    <div class="background">

        <div class="circle circle1"></div>

        <div class="circle circle2"></div>

        <div class="circle circle3"></div>

    </div>


    <!-- Login Card -->

    <div class="login-card">


        <!-- Company Logo -->

        <div class="logo">

            <img src="images/logo.png.png"
                 alt="Modern Chain Link Company Logo">

        </div>


        <!-- Company Name -->

        <div class="company">

            <h1>Modern Chain Link Company</h1>

            <p>Order Management System</p>

        </div>


        <!-- Login Form -->

        <form id="loginForm">

            <h2>Administrator Login</h2>


            <div class="input-box">

                <label>Email Address</label>

                <input
                    type="email"
                    id="username"
                    placeholder="Enter Admin Email">

            </div>


            <div class="input-box">

                <label>Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter Password">

            </div>


            <p id="errorMessage"></p>


            <button
                type="submit"
                class="login-btn">

                Login

            </button>

        </form>


        <div class="footer">

            © 2026 Modern Chain Link Company

        </div>

    </div>


    <script src="js/login.js"></script>

</body>

</html>
